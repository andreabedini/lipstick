name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Images are pinned rather than *-latest, which move to new releases
        # (ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19,
        # actions/runner-images#14748). The image is also in the cache key,
        # so a cabal store built on one image is not restored on another.
        os: [ubuntu-24.04, macos-26, windows-2025]
        ghc: ['9.12.2']
        # The other supported compilers, on one platform.
        include:
          - os: ubuntu-24.04
            ghc: '9.10.3'
          - os: ubuntu-24.04
            ghc: '9.14.1'
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF line endings on Windows: the tests read data files from the
      # checkout.
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # Image 20261013 ships the Command Line Tools 27.0, with the macOS 27
      # SDK, but keeps Xcode 26.6 selected, whose linker cannot read that
      # SDK ("tapi error: malformed file"). Use the Command Line Tools'
      # own linker until the image is fixed (actions/runner-images#14940).
      - name: Select the Command Line Tools
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.16.1.0'

      - name: Check the package descriptions
        run: |
          cabal check
          (cd lipstick-brick && cabal check)

      - name: Resolve dependencies
        run: |
          cabal update
          cabal build all --enable-tests --dry-run

      - uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ matrix.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ matrix.os }}-ghc-${{ matrix.ghc }}-

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --test-show-details=direct

      # The >>> examples in the Haddock documentation, with the output
      # they show. They assume OverloadedStrings, as the documentation says.
      - name: Run the documentation examples
        if: runner.os == 'Linux' && matrix.ghc == '9.12.2'
        run: |
          cabal install doctest-0.25.0.2 --ignore-project --installdir="$HOME/.local/bin" --install-method=copy --overwrite-policy=always
          cabal repl lipstick --with-compiler="$HOME/.local/bin/doctest" --repl-options=-XOverloadedStrings

      # The README screenshots are drawn from examples/Screenshots.hs; any
      # change in rendering must come with updated images. They are
      # checked on one platform only.
      - name: Check screenshots are up to date
        if: runner.os == 'Linux' && matrix.ghc == '9.12.2'
        run: |
          cabal run -v0 lipstick-screenshots -- docs/images
          if [ -n "$(git status --porcelain -- docs/images)" ]; then
            git status --short -- docs/images
            git diff --stat -- docs/images
            echo "::error::Rendering changed: run 'cabal run lipstick-screenshots -- docs/images' and commit docs/images"
            exit 1
          fi
